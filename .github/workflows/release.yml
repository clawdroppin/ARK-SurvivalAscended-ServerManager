name: Release

# Push a tag like v0.2.0 to build and publish the installer, MSI and portable zip.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build installer + portable
        run: npm run build:all
      - name: Collect artifacts (stable file names for /releases/latest/download links)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName out/ASA-Server-Manager-Setup.exe
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1).FullName out/ASA-Server-Manager.msi
          Copy-Item (Get-ChildItem release/*.zip | Select-Object -First 1).FullName out/ASA-Server-Manager-Portable.zip
          Get-ChildItem out | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          Get-FileHash out/* -Algorithm SHA256 | ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } | Out-File -Encoding ascii out/SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ASA Server Manager ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
          body: |
            ## Downloads
            | File | What it is |
            |---|---|
            | **ASA-Server-Manager-Setup.exe** | Installer (recommended) – data in `%APPDATA%` |
            | **ASA-Server-Manager.msi** | Same, as MSI |
            | **ASA-Server-Manager-Portable.zip** | No install – unzip anywhere writable; data stays in the folder |

            Windows SmartScreen may warn because the app isn't code-signed yet: **More info → Run anyway**.
            See the [README](https://github.com/clawdroppin/ARK-SurvivalAscended-ServerManager#readme) for the quick-start guide and [CHANGELOG](https://github.com/clawdroppin/ARK-SurvivalAscended-ServerManager/blob/main/CHANGELOG.md) for details.
          files: |
            out/ASA-Server-Manager-Setup.exe
            out/ASA-Server-Manager.msi
            out/ASA-Server-Manager-Portable.zip
            out/SHA256SUMS.txt
