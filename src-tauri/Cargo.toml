[package]
name = "asa-server-manager"
version = "0.1.0"
description = "ARK: Survival Ascended dedicated server manager"
authors = ["clawdroppin"]
license = "MIT"
repository = "https://github.com/clawdroppin/ARK-SurvivalAscended-ServerManager"
edition = "2021"

[lib]
name = "asa_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
futures-util = "0.3.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "stream", "query", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "network", "disk"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
uuid = { version = "1.27.0", features = ["v4"] }
walkdir = "2.5.0"
zip = { version = "9.0.0", default-features = false, features = ["deflate-flate2-zlib-rs", "time"] }
